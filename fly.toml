# Fly.io config for Textblast.io — deploys to the `textblast` Fly app.
app = "textblast"
primary_region = "iad"

[build]
  dockerfile = "Dockerfile"

[env]
  # Database is managed Postgres (Neon). The connection string is a Fly secret
  # named NEON_PRODUCTION_DATABASE_URL, mapped to DATABASE_URL at container
  # start (see Dockerfile CMD) — set it with:
  #   fly secrets set NEON_PRODUCTION_DATABASE_URL="postgresql://…?sslmode=require"
  APP_BASE_URL = "https://puffping.com"

[http_service]
  internal_port = 3000
  force_https = true
  # The campaign send queue drains in a background worker inside the web
  # process — keep at least one machine running so sends never pause.
  auto_stop_machines = "off"
  auto_start_machines = true
  min_machines_running = 1

[[vm]]
  memory = "1gb"
  cpu_kind = "shared"
  cpus = 1
